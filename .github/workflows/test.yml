name: Test

on:
  push:
  pull_request:

jobs:
  test-web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm run test

  test-api:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: development
      JWT_SECRET: '123'
      CREATE_ADMIN_PASSWORD: 123

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm run test

      - name: Run E2E tests
        run: npm run test:e2e